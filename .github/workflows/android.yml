name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-dev-debug:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run shared and Android unit tests
      run: ./gradlew :shared:jvmTest :app:testDevDebugUnitTest

    - name: Build Dev Debug APK
      run: ./gradlew :app:assembleDevDebug

    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: android-test-reports
        path: |
          app/build/reports/tests/
          shared/build/reports/tests/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-dev-debug
        path: app/build/outputs/apk/dev/debug/*.apk
