name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      universal_from_run:
        description: 'Extract an APK from a successful build on this branch (run ID); empty builds normally'
        required: false
        type: string
        default: ''

      apk_abi:
        description: 'APK architecture to extract from the verified build'
        required: false
        type: choice
        default: universal
        options:
          - universal
          - arm64-v8a
          - armeabi-v7a
          - x86_64
      verify_release:
        description: 'Verify an existing universal APK without rebuilding or replacing it (release tag)'
        required: false
        type: string
        default: ''
      install_api:
        description: 'For verification: Android API level to test installation on a clean emulator'
        required: false
        type: string
        default: ''
      compare_release:
        description: 'Previous release tag for APK signing comparison'
        required: false
        type: string
        default: ''

jobs:
  verify-published-apk:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_release != ''
    permissions:
      contents: read
    uses: ./.github/workflows/verify-android-apk.yml
    with:
      release_tag: ${{ inputs.verify_release }}
      compare_tag: ${{ inputs.compare_release }}
      install_api: ${{ inputs.install_api }}

  publish-universal:
    if: github.event_name == 'workflow_dispatch' && inputs.universal_from_run != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
    - name: Extract a verified APK and publish a test download
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RUN_ID: ${{ inputs.universal_from_run }}
        APK_ABI: ${{ inputs.apk_abi || 'universal' }}
        EXPECTED_BRANCH: ${{ github.ref_name }}
      shell: bash
      run: |
        set -euo pipefail
        exec 2> >(tee publish-errors.log >&2)
        trap 'status=$?; echo "::error::Universal publish failed at line $LINENO: $BASH_COMMAND"; while IFS= read -r line; do echo "::error::$line"; done < <(tail -n 8 publish-errors.log); exit "$status"' ERR
        [[ "$RUN_ID" =~ ^[0-9]+$ ]]
        gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > run.json
        python3 - <<'PY'
        import json, os
        run = json.load(open('run.json'))
        assert run['conclusion'] == 'success', 'Source build did not succeed'
        assert run['head_branch'] == os.environ['EXPECTED_BRANCH'], 'Source build belongs to another branch'
        assert run['path'] == '.github/workflows/android.yml', 'Unexpected source workflow'
        PY
        SOURCE_SHA=$(python3 -c 'import json; print(json.load(open("run.json"))["head_sha"])')
        gh run download "$RUN_ID" --name bitchord-dev-debug --dir artifact
        case "$APK_ABI" in universal|arm64-v8a|armeabi-v7a|x86_64) ;; *) echo 'Unsupported APK ABI'; exit 1 ;; esac
        mapfile -t APKS < <(find artifact -type f -name "*$APK_ABI*.apk")
        [[ "${#APKS[@]}" -eq 1 ]] || { echo 'Expected exactly one APK for the selected ABI'; exit 1; }
        FILE="BitChord-Dev-Automix-$APK_ABI.apk"
        cp "${APKS[0]}" "$FILE"
        unzip -tq "$FILE"
        SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
        "$SIGNER" verify --verbose --print-certs "$FILE"
        sha256sum "$FILE" > "$FILE.sha256"
        CHECKSUM=$(cut -d' ' -f1 "$FILE.sha256")
        echo "::notice::Verified APK archive and Android signature: $FILE; SHA-256=$CHECKSUM"
        TAG="automix-test-${SOURCE_SHA:0:7}"
        printf 'Test build from commit `%s`, extracted without rebuilding from Actions run %s.\n\nTest APK for BitChord Dev (separate from the normal app). Custom playlist timing is enabled; four-stem separation is not implemented.\n\nSHA-256: `%s`\n' "$SOURCE_SHA" "$RUN_ID" "$CHECKSUM" > notes.md
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" "$FILE" "$FILE.sha256" --clobber
        else
          gh release create "$TAG" "$FILE" "$FILE.sha256" --target "$SOURCE_SHA" --prerelease --latest=false --title 'BitChord Dev · Automix test · Universal' --notes-file notes.md
        fi
        echo "APK ($APK_ABI): https://github.com/$GH_REPO/releases/download/$TAG/$FILE" >> "$GITHUB_STEP_SUMMARY"

  build-dev-debug:
    if: github.event_name != 'workflow_dispatch' || (inputs.universal_from_run == '' && inputs.verify_release == '')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run shared and Android unit tests
      run: ./gradlew :shared:jvmTest :app:testDevDebugUnitTest

    - name: Build Dev Debug APK
      run: ./gradlew :app:assembleDevDebug

    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: android-test-reports
        path: |
          app/build/reports/tests/
          shared/build/reports/tests/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-dev-debug
        path: app/build/outputs/apk/dev/debug/*.apk
