name: Verify published Android APK

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      install_api:
        description: 'Optional Android API level for a clean-emulator installation test'
        required: false
        type: string
        default: ''
      compare_tag:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag containing the universal test APK'
        required: true
        type: string
      install_api:
        description: 'Optional Android API level for a clean-emulator installation test'
        required: false
        type: string
        default: ''
      compare_tag:
        description: 'Optional previous release tag to check update-signature compatibility'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the distributed APK and compare signing certificates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          COMPARE_TAG: ${{ inputs.compare_tag }}
        shell: bash
        run: |
          set -euo pipefail
          exec 2> >(tee verification-errors.txt >&2)
          trap 'status=$?; echo "::error::APK verification failed at line $LINENO: $BASH_COMMAND"; while IFS= read -r line; do echo "::error::$line"; done < <(tail -n 5 verification-errors.txt); exit "$status"' ERR
          FILE=BitChord-Dev-Automix-universal.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          test -n "$SIGNER" && test -n "$AAPT"
          gh release download "$RELEASE_TAG" --pattern "$FILE" --dir current
          unzip -tq "current/$FILE"
          "$SIGNER" verify --verbose --print-certs "current/$FILE" | tee current-cert.txt
          "$AAPT" dump badging "current/$FILE" > current-manifest.txt
          {
            printf 'Release: %s\n' "$RELEASE_TAG"
            sha256sum "current/$FILE"
            cat current-cert.txt
            grep -E '^(package:|sdkVersion:|targetSdkVersion:|native-code:)' current-manifest.txt
          } | tee verification.txt
          echo '::notice::Published APK ZIP integrity and Android signature verification passed.'
          while IFS= read -r line; do echo "::notice::$line"; done < <(grep -E '^(package:|sdkVersion:|targetSdkVersion:|native-code:)' current-manifest.txt)
          if [[ -n "$COMPARE_TAG" ]]; then
            gh release download "$COMPARE_TAG" --pattern "$FILE" --dir previous
            "$SIGNER" verify --print-certs "previous/$FILE" > previous-cert.txt
            # Recent build-tools label signers with their SDK range instead of #1.
            BEFORE=$(grep 'certificate SHA-256 digest:' previous-cert.txt | sed 's/.*digest: //' | sort -u)
            AFTER=$(grep 'certificate SHA-256 digest:' current-cert.txt | sed 's/.*digest: //' | sort -u)
            test -n "$BEFORE" && test -n "$AFTER"
            echo "::notice::Previous APK certificate SHA-256: $BEFORE"
            echo "::notice::Current APK certificate SHA-256: $AFTER"
            {
              printf '\nPrevious release: %s\n%s\nCurrent: %s\n' "$COMPARE_TAG" "$BEFORE" "$AFTER"
              if [[ "$BEFORE" == "$AFTER" ]]; then
                echo 'Signing certificates MATCH. This check does not prove installability on a particular phone.'
                echo '::notice::Previous and current APK signing certificates match.'
              else
                echo 'Signing certificates DIFFER. Android will not accept a normal in-place update between these APKs. Do not uninstall without backing up app data.'
                echo '::warning::APK signing certificates DIFFER: normal in-place update from the compared release is not supported. Back up data before any removal.'
              fi
            } | tee -a verification.txt
          fi
          cat verification.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Inspect available emulator images
        if: inputs.install_api != ''
        env:
          REQUESTED_API: ${{ inputs.install_api }}
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list --channel=3 > sdk-images.txt
          echo "::notice::Requested clean emulator API: $REQUESTED_API"
          while IFS= read -r line; do echo "::notice::$line"; done < <(grep -E 'system-images;android-(3[6-9]|[A-Z])' sdk-images.txt | grep x86_64 | tail -n 35)
      - name: Enable emulator acceleration
        if: inputs.install_api != ''
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare actual install test
        if: inputs.install_api != ''
        shell: bash
        run: |
          cat > install-smoke.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -uo pipefail
          adb shell getprop ro.build.version.release | tee android-version.txt
          adb shell getprop ro.build.version.sdk | tee android-sdk.txt
          adb shell getprop ro.product.cpu.abi | tee android-abi.txt
          adb shell getconf PAGE_SIZE | tee android-page-size.txt
          adb install -r current/BitChord-Dev-Automix-universal.apk > install-result.txt 2>&1
          status=$?
          cat install-result.txt
          if [[ "$status" -ne 0 ]]; then
            while IFS= read -r line; do echo "::error::APK install: $line"; done < install-result.txt
            adb logcat -d -b all > install-logcat.txt
            exit "$status"
          fi
          echo '::notice::Published universal APK installed successfully on a clean Android emulator.'
          adb shell am start -W -n com.dev.bitchord/com.music.bitchord.MainActivity > launch-result.txt 2>&1
          cat launch-result.txt
          adb logcat -d -b crash > install-crashes.txt
          SCRIPT
      - name: Install the published APK on clean Android
        if: inputs.install_api != ''
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.install_api }}
          arch: x86_64
          target: google_apis
          channel: ${{ inputs.install_api == '37' && 'canary' || 'stable' }}
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 2048
          script: bash install-smoke.sh
      - name: Save APK verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-verification
          path: |
            verification.txt
            current-cert.txt
            current-manifest.txt
            previous-cert.txt
            install-*.txt
            launch-result.txt
            android-*.txt
            sdk-images.txt
          if-no-files-found: warn
